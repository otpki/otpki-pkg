name: Check

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/otpki/*

    steps:
    - name: Generate GitHub App token
      id: generate_token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ secrets.GH_APP_ID }}
        private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
        owner: otpki
        repositories: |
          ${{ github.event.repository.name }}
          otpki-protobuf
          scep
          circl

    - name: Configure git for private GitHub deps
      run: |
        git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
      env:
        GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - uses: ./.github/actions/setup-ci

    - name: Check Go formatting
      run: just format-check

    - name: Run Go linters
      run: just lint

    - name: Run short tests
      run: just test-ci

    - name: Tidy Go modules
      run: just tidy

    - name: Check for file changes
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "File has changed! Either .gitignore or formatting changes required."
          git status --porcelain
          exit 1
        else
          echo "No changes needed."
        fi

  vulncheck:
    name: Vulnerability scan (advisory)
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/otpki/*

    steps:
    - name: Generate GitHub App token
      id: generate_token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ secrets.GH_APP_ID }}
        private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
        owner: otpki
        repositories: |
          ${{ github.event.repository.name }}
          otpki-protobuf
          scep
          circl

    - name: Configure git for private GitHub deps
      run: |
        git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
      env:
        GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - uses: ./.github/actions/setup-ci

    - name: Check known vulnerabilities
      run: just vulncheck
