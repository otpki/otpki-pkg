name: Check

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AWS_ARTIFACT_BUCKET_NAME: ${{ vars.AWS_ARTIFACT_BUCKET_NAME }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      GOPRIVATE: github.com/otpki/*

    steps:
    - name: Generate GitHub App token
      id: generate_token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ secrets.GH_APP_ID }}
        private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
        owner: otpki
        repositories: |
          ${{ github.event.repository.name }}
          otpki-protobuf
          scep

    - name: Configure git for private GitHub deps
      run: |
        git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
      env:
        GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

    - name: Checkout code
      uses: actions/checkout@v6

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ env.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup IOGO
      uses: otpki/setup-iogo@v1
      with:
        go-version: 1.27.0
        bucket-name: ${{ env.AWS_ARTIFACT_BUCKET_NAME }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Just
      uses: extractions/setup-just@v3

    - name: Run just check
      run: just check

    - name: Check for file changes
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "File has changed! Either .gitignore or formatting changes required."
          git status --porcelain
          exit 1
        else
          echo "No changes needed."
        fi