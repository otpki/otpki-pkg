name: Check

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'

    - name: Run go fmt
      run: |
        go fmt ./...

    - name: Check for file changes
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "File has changed! Either .gitignore or formatting changes required."
          git status --porcelain
          exit 1
        else
          echo "No changes needed."
        fi

    - name: Run go test
      run: go test ./...