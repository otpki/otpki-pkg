name: Feature request
description: An idea for a package API, behavior, or developer tooling
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: TL;DR
      description: The one-line version.
      placeholder: "TL;DR: add a helper for a certificate encoding used by an interoperating client"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing today and why it matters to you.
    validations:
      required: true

  - type: textarea
    id: build
    attributes:
      label: What to build
      description: What it should do. A short list works well, and sketch the config or API if there is new surface.
      placeholder: |
        1. Identify the affected package and proposed API
        2. Describe expected behavior and error handling
        3. Note compatibility and documentation changes
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done means
      description: How we can tell it works. A checklist is great.
      placeholder: |
        - [ ] the intended use case is covered by tests
        - [ ] existing callers keep working
        - [ ] just check passes
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Out of scope notes, alternatives you tried, links to relevant docs or standards.
    validations:
      required: false
